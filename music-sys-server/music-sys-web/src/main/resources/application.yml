server:
  port: 8080
  servlet:
    context-path: /

app:
  upload:
    path: ${MUSIC_SYS_UPLOAD_PATH:${user.home}/music-sys/uploads}
    cover-max-size: 5242880
    audio-max-size: 52428800

spring:
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 60MB
  profiles:
    active: dev

  datasource:
    url: jdbc:mysql://localhost:3306/music_sys?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
  mapper-locations: classpath*:/mapper/**/*.xml

jwt:
  secret: ${JWT_SECRET:change-me-please}
  expiration: 86400

logging:
  level:
    com.musicsys: debug
    org.springframework.security: info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
