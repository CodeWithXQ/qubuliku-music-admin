spring:
  datasource:
    url: jdbc:mysql://localhost:3306/music_sys?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ${MYSQL_PASSWORD}

  # Redis — 缓存三大问题（穿透/击穿/雪崩）+ 秒杀扣库存
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: 3000ms

logging:
  level:
    com.musicsys.mapper: debug
